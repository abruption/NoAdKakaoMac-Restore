name: 복원 도구 검사
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-26-intel
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: 합성 복원 시험
        run: python3 -m unittest discover -s Tests -v
      - name: 단일 스크립트 생성 및 확인
        run: |
          python3 scripts/build-release.py
          sh build/release/restore.sh --version
          sh build/release/restore.sh --help
          sh build/release/diagnose.sh --help
          sh build/release/diagnose.sh --version
          python3 scripts/check-diagnostic.py
          cd build/release
          shasum -a 256 -c SHA256SUMS
